# ==============================================================================
# Nginx Virtual Host Configuration - Chatwoot
# Dominio: chatwood.digianaapp.com.br
# Upstream local: 127.0.0.1:3000 (chatwoot_web)
# ==============================================================================

# Redirecionamento HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name chatwood.digianaapp.com.br;

    # Validacao do Certbot Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS com Proxy Reverso e suporte a WebSocket (/cable)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chatwood.digianaapp.com.br;

    # Certificados SSL (Ajuste os caminhos conforme sua configuracao Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/chatwood.digianaapp.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatwood.digianaapp.com.br/privkey.pem;

    # Configuracoes de seguranca SSL recomendadas
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Tamanho maximo para upload de anexos / midias
    client_max_body_size 50M;

    # Logs de acesso e erro
    access_log /var/log/nginx/chatwoot_access.log;
    error_log /var/log/nginx/chatwoot_error.log;

    # Cabecalhos de seguranca
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Proxy Principal da Aplicacao Web
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts para requisicoes de longa duracao
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }

    # Proxy de WebSocket para tempo real (ActionCable /cable)
    location /cable {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keepalive longo para manter conexao WebSocket aberta
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
